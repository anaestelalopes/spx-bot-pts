name: Bot de Lembrete SeaTalk

on:
  workflow_dispatch: {}  # disparado pelo cron-job.org a cada 1 minuto, e também manualmente pelo botão "Run workflow"

permissions:
  contents: write  # necessário pra poder salvar o notified_events.json de volta no repo

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests google-auth google-api-python-client

      - name: Criar credentials.json a partir do Secret
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Rodar o bot
        timeout-minutes: 2
        env:
          SEATALK_APP_ID: ${{ secrets.SEATALK_APP_ID }}
          SEATALK_APP_SECRET: ${{ secrets.SEATALK_APP_SECRET }}
        run: python main.py

      - name: Salvar controle de eventos já notificados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add notified_events.json
          git diff --staged --quiet && exit 0
          git commit -m "Atualiza controle de eventos notificados [skip ci]"

          # Outra execução pode estar rodando ao mesmo tempo (o cron-job.org
          # dispara de 1 em 1 minuto) e já ter empurrado uma versão mais nova
          # do notified_events.json antes desta. Se o push for rejeitado por
          # isso, em vez de deixar o Git tentar resolver linha por linha (o
          # JSON reescreve o arquivo inteiro a cada vez, o que gera conflito
          # à toa), eu mesmo mesclo o conteúdo dos dois arquivos e tento de
          # novo - até 5 vezes.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejeitado (tentativa $i), mesclando com a versão mais recente..."
            git fetch origin main
            git show origin/main:notified_events.json > /tmp/remote_notified.json 2>/dev/null || echo '{}' > /tmp/remote_notified.json
            python3 -c "
          import json
          local = json.load(open('notified_events.json'))
          remote = json.load(open('/tmp/remote_notified.json'))
          merged = {**remote, **local}
          json.dump(merged, open('notified_events.json', 'w'), ensure_ascii=False, indent=2)
          "
            git reset --soft origin/main
            git add notified_events.json
            git diff --staged --quiet || git commit -m "Atualiza controle de eventos notificados [skip ci]"
            sleep 2
          done
          echo "Não consegui salvar o controle de eventos notificados depois de várias tentativas."
          exit 1
