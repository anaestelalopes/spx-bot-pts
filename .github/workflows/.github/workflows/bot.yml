name: Bot de Lembrete SeaTalk

on:
  schedule:
    # Roda a cada 5 minutos (menor intervalo que o GitHub Actions permite).
    # Como o script olha os próximos 10 minutos, isso cobre bem o evento.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # permite rodar manualmente pelo botão "Run workflow"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests google-auth google-api-python-client

      - name: Criar credentials.json a partir do Secret
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Rodar o bot
        run: python main.py
